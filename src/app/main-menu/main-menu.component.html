<goa-work-side-menu
  [attr.heading]="heading"
  [attr.user-name]="userName"
  [attr.user-secondary-text]="userSecondaryText"
  open
  aria-label="Workspace navigation">

  <div slot="primary">
    <goa-work-side-menu-item
      [attr.icon]="searchItem.icon"
      [attr.label]="searchItem.label"
      [attr.url]="searchItem.url"></goa-work-side-menu-item>

    @for (entry of entries; track entry.kind === 'group' ? entry.heading : entry.label) {
      @if (entry.kind === 'item') {
        <goa-work-side-menu-item
          [attr.icon]="entry.icon"
          [attr.label]="entry.label"
          [attr.url]="entry.url"
          [attr.current]="entry.current ? true : null"></goa-work-side-menu-item>
      } @else {
        <goa-work-side-menu-group
          [attr.heading]="entry.heading"
          [attr.icon]="entry.icon">
          @for (child of entry.items; track child.label) {
            <goa-work-side-menu-item
              [attr.label]="child.label"
              [attr.url]="child.url"
              [attr.current]="child.current ? true : null"></goa-work-side-menu-item>
          }
        </goa-work-side-menu-group>
      }
    }
  </div>

  <div slot="secondary">
    <goa-work-side-menu-item
      [attr.icon]="helpItem.icon"
      [attr.label]="helpItem.label"
      [attr.url]="helpItem.url"></goa-work-side-menu-item>
  </div>

  <a slot="account" href="#" aria-label="Account: {{ userName }}, {{ userSecondaryText }}"></a>
</goa-work-side-menu>
