<div class="page">
  <h1 class="greeting">{{ greeting }}, {{ firstName }}</h1>

  <div class="section-header">
    <h2 class="section-title">Notifications</h2>
  </div>

  <!-- Title and tabs sit on the page; the bordered card wraps only the list. -->
  <div class="tabs-area">
  <!-- Level with the tab tray, so it reads as acting on the selected tab only. -->
  @if (activeSeverityTab(); as tab) {
    @if (tab.items.length > 0) {
      <div class="tab-action">
        <goab-button type="tertiary" size="compact" (onClick)="markAllDone()">Mark all as done</goab-button>
      </div>
    }
  }
  <goab-tabs variant="segmented" navigation="none" orientation="horizontal" (onChange)="onTabChange($event)">
    @for (tab of tabs(); track tab.key) {
      <ng-template #tabHeading>
        <span class="tab-heading">
          {{ tab.label }}
          @if (tab.badge) {
            <goab-badge [type]="tab.badge" emphasis="subtle" [content]="'' + tab.items.length" size="medium"></goab-badge>
          }
        </span>
      </ng-template>
      <goab-tab [heading]="tabHeading">
        <goab-container padding="compact" class="list-card">
          <hub-notification-list
            class="list"
            [items]="tab.items"
            emptyMessage="You're all caught up. There are no notifications from the last 30 days."
            (dismiss)="service.dismiss($event)"></hub-notification-list>
        </goab-container>
      </goab-tab>
    }
  </goab-tabs>
  </div>

  <p class="footer-link">
    Showing active notifications from the last 30 days.
    <goab-link trailingIcon="arrow-forward"><a [href]="notificationsUrl">View all notifications</a></goab-link>
  </p>
</div>
