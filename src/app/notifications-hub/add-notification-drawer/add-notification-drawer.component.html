<ng-template #drawerHeading>
  <div class="drawer-heading">
    <span>Add notification</span>
    <goab-icon-button
      class="minimize"
      icon="remove"
      size="medium"
      ariaLabel="Minimize and return to the page"
      (onClick)="composer.minimize()"></goab-icon-button>
  </div>
</ng-template>

<ng-template #drawerActions>
  <goab-button-group alignment="start">
    <goab-button type="primary" (onClick)="save()">Save</goab-button>
    <goab-button type="secondary" (onClick)="discard()">Cancel</goab-button>
  </goab-button-group>
</ng-template>

<!-- Always rendered, so minimizing keeps every field (and the dropdowns' picks)
     exactly as the user left them. -->
<goab-drawer
  [open]="composer.state() === 'open'"
  position="right"
  [heading]="drawerHeading"
  maxSize="480px"
  [actions]="drawerActions"
  (onClose)="onClose()">
  <div class="fields">
    <goab-form-item
      label="Who to notify"
      helpText="Select everyone who should get this reminder."
      [error]="submitted ? errors.notifyTo : ''">
      <goab-dropdown-multiselect
        name="notifyTo"
        width="100%"
        placeholder="Select who to notify"
        [value]="form.notifyTo"
        [error]="submitted && !!errors.notifyTo"
        (onChange)="onNotifyTo($event)">
        @for (g of notifyTo; track g) {
          <goab-dropdown-item [value]="g" [label]="g"></goab-dropdown-item>
        }
      </goab-dropdown-multiselect>
    </goab-form-item>

    <goab-form-item label="Title" [error]="submitted ? errors.title : ''">
      <goab-input
        name="title"
        width="100%"
        [value]="form.title"
        [error]="submitted && !!errors.title"
        (onChange)="onTitle($event)"></goab-input>
    </goab-form-item>

    <goab-form-item label="Message" [error]="submitted ? errors.message : ''">
      <goab-textarea
        name="message"
        width="100%"
        [rows]="4"
        [value]="form.message"
        [error]="submitted && !!errors.message"
        (onChange)="onMessage($event)"></goab-textarea>
    </goab-form-item>

    <goab-form-item label="Program" requirement="optional" helpText="Type a program name or ID to find it.">
      <goab-dropdown
        name="programId"
        width="100%"
        [filterable]="true"
        leadingIcon="search"
        placeholder="Search programs"
        noResults="No programs match your search"
        [value]="form.programId"
        (onChange)="onProgram($event)">
        @for (p of programs; track p.id) {
          <goab-dropdown-item [value]="p.id" [label]="p.name + ' (' + p.id + ')'"></goab-dropdown-item>
        }
      </goab-dropdown>
    </goab-form-item>

    <goab-form-item
      label="Reminder date"
      helpText="The notification appears on this date."
      [error]="submitted ? errors.reminderDate : ''">
      <goab-date-picker
        name="reminderDate"
        [value]="form.reminderDate"
        [error]="submitted && !!errors.reminderDate"
        (onChange)="onDate($event)"></goab-date-picker>
    </goab-form-item>
  </div>
</goab-drawer>

@if (composer.state() === 'minimized') {
  <div class="dock" role="region" aria-label="Notification draft">
    <goab-button type="secondary" size="compact" leadingIcon="chevron-up" (onClick)="composer.open()">
      Add notification (draft)
    </goab-button>
    <goab-icon-button
      icon="close"
      size="medium"
      ariaLabel="Discard draft"
      (onClick)="discard()"></goab-icon-button>
  </div>
}
