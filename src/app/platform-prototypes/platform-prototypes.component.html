<main class="prototypes-page">
  <header class="page-header">
    <h1>{{ heading }}</h1>
    <p class="lede">
      A directory of the prototypes in this project. Choose one to open it.
    </p>
  </header>

  <ul class="proto-list">
    @for (proto of prototypes; track proto.path) {
      <li>
        <a class="proto-card" [routerLink]="proto.path">
          <span class="proto-card__header">
            <span class="proto-card__title">{{ proto.label }}</span>
            @if (proto.status) {
              <goa-badge type="information" [attr.content]="proto.status"></goa-badge>
            }
          </span>
          <span class="proto-card__desc">{{ proto.description }}</span>
        </a>
      </li>
    }
  </ul>
</main>
