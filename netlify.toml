[build]
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist/sage-prototype/browser"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "22.23.1"

[[plugins]]
  package = "@netlify/angular-runtime"
  pinned_version = "3.0.1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
